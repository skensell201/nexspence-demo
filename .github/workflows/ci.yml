name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - name: Install golangci-lint (pinned, via Go proxy)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Run golangci-lint
        run: golangci-lint run ./...

  frontend:
    name: frontend tests (≥80% coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check production build
        run: npm run build
      - name: Type-check test files
        run: npm run typecheck:test
      - name: Run tests with coverage (≥80% threshold)
        run: npm run test:coverage

  coverage:
    name: unit test coverage (per-package ≥80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - name: Enforce per-package ≥80% floor
        run: |
          # Packages explicitly excluded from the ≥80% unit-test floor.
          # Each exclusion is a Python regex matched against the full package path.
          # Reasons:
          #   internal/db$           — goose migration runner, no testable business logic
          #   internal/logger$       — thin zap wrapper, no logic
          #   internal/config$       — viper config struct, no logic
          #   internal/api$          — gin router wiring; middleware is tested via
          #                            internal/api/handlers/* and internal/api/*_test.go
          #   internal/audit$        — partition-rotation goroutine requires live Postgres
          #   internal/auth$         — LDAP bind path requires a live server; JWT/bcrypt
          #                            unit coverage deferred to a follow-up track
          #   internal/metrics$      — StartSampler/takeSample require live pgxpool
          #   internal/storage$      — tested via integration-tagged MinIO tests
          #   internal/repository/postgres$ — tested via integration-tagged dockertest
          #   internal/testutil$     — test helpers, not production code
          #   internal/formats$      — top-level formats package has no Go files
          #   cmd/                   — entrypoint wiring
          python3 - <<'PYEOF'
          import subprocess, re, sys

          EXCLUDED = [
              r"internal/db$",
              r"internal/logger$",
              r"internal/config$",
              r"internal/api$",
              r"internal/audit$",
              r"internal/auth$",
              r"internal/metrics$",
              r"internal/storage$",
              r"internal/repository/postgres$",
              r"internal/testutil$",
              r"internal/formats$",
              r"cmd/",
          ]

          result = subprocess.run(
              ["go", "test", "-count=1", "-cover", "./internal/...", "./cmd/..."],
              capture_output=True, text=True
          )
          fail = 0
          for line in result.stdout.splitlines():
              if not line.startswith("ok"):
                  continue
              parts = line.split()
              pkg = parts[1]
              m = re.search(r"coverage: ([0-9.]+)%", line)
              if not m:
                  continue
              pct = float(m.group(1))
              short = pkg.split("/nexspence/")[-1]

              if any(re.search(ex, short) for ex in EXCLUDED):
                  print(f"  skip  {short}: {pct:.1f}%")
                  continue

              if pct >= 80.0:
                  print(f"  ok    {short}: {pct:.1f}%")
              else:
                  print(f"::error::{pkg} coverage {pct:.1f}% is below the 80% floor")
                  fail = 1

          sys.exit(fail)
          PYEOF

  integration:
    name: integration tests (postgres + storage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - name: Run postgres integration tests with coverage
        run: |
          go test -tags=integration -count=1 \
            -coverpkg=./internal/repository/postgres/... \
            -coverprofile=pg_cov.out \
            ./internal/repository/postgres/...
      - name: Enforce postgres package ≥80%
        run: |
          pct=$(go tool cover -func=pg_cov.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "postgres coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 80) ? 0 : 1 }' || {
            echo "::error::postgres repository coverage ${pct}% is below the 80% floor"; exit 1; }
      - name: Run storage integration tests (MinIO via dockertest)
        run: |
          go test -tags=integration -count=1 \
            -coverpkg=./internal/storage/... \
            -coverprofile=storage_cov.out \
            ./internal/storage/...
      - name: Run end-to-end integration tests (full router + real-shape registry fakes)
        run: |
          go test -tags=integration -count=1 ./internal/integration/...
      - name: Enforce storage package ≥80%
        run: |
          pct=$(go tool cover -func=storage_cov.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "storage coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 80) ? 0 : 1 }' || {
            echo "::error::storage coverage ${pct}% is below the 80% floor"; exit 1; }

  helm:
    name: helm lint and template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Lint and render the chart
        # helm is pre-installed on ubuntu-latest (same as the release workflow).
        working-directory: deploy/helm/nexspence
        run: |
          set -euo pipefail

          render() {
            name="$1"
            shift
            helm template ci . "$@" >"/tmp/helm-${name}.yaml"
            docker run --rm \
              -v /tmp:/tmp:ro \
              ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
              -strict -ignore-missing-schemas -summary \
              "/tmp/helm-${name}.yaml"
          }

          expect_failure() {
            description="$1"
            shift
            if "$@" >/tmp/helm-expected-failure.log 2>&1; then
              echo "::error::expected failure: ${description}"
              exit 1
            fi
          }

          helm lint .
          render bundled
          grep -q 'name: ci-postgres' /tmp/helm-bundled.yaml
          grep -q 'clusterIP: None' /tmp/helm-bundled.yaml

          render external-dsn \
            --set postgresql.enabled=false \
            --set-string externalDatabase.dsn='postgres://u:p@host:5432/nexspence?sslmode=disable'
          grep -q 'NEXSPENCE_DATABASE_DSN: "postgres://u:p@host:5432/nexspence?sslmode=disable"' /tmp/helm-external-dsn.yaml
          if grep -q 'kind: StatefulSet' /tmp/helm-external-dsn.yaml; then
            echo "::error::bundled Postgres StatefulSet must not render when postgresql.enabled=false"
            exit 1
          fi

          render external-secret \
            --set postgresql.enabled=false \
            --set-string externalDatabase.dsn='' \
            --set externalDatabase.existingSecret=external-db
          grep -q 'name: external-db' /tmp/helm-external-secret.yaml
          grep -q 'key: dsn' /tmp/helm-external-secret.yaml

          render bundled-existing-secret \
            --set postgresql.auth.existingSecret=postgres-db \
            --set-string postgresql.auth.password=''
          grep -q 'name: PGPASSWORD' /tmp/helm-bundled-existing-secret.yaml
          grep -q 'name: postgres-db' /tmp/helm-bundled-existing-secret.yaml
          grep -q 'NEXSPENCE_DATABASE_DSN: "postgres://nexspence@ci-postgres:5432/nexspence?sslmode=disable"' /tmp/helm-bundled-existing-secret.yaml
          if grep -q 'postgres://nexspence:' /tmp/helm-bundled-existing-secret.yaml; then
            echo "::error::bundled DSN must not contain a password slot"
            exit 1
          fi

          render bundled-existing-secret-with-fallback \
            --set postgresql.auth.existingSecret=postgres-db \
            --set-string postgresql.auth.password='must-not-render'
          if grep -q 'must-not-render' /tmp/helm-bundled-existing-secret-with-fallback.yaml; then
            echo "::error::password fallback rendered despite existingSecret"
            exit 1
          fi

          render bundled-space-username \
            --set-string postgresql.auth.username='user name' \
            --set-string postgresql.auth.password='a b'
          grep -q 'NEXSPENCE_DATABASE_DSN: "postgres://user%20name@ci-postgres:5432/nexspence?sslmode=disable"' /tmp/helm-bundled-space-username.yaml

          render bundled-ephemeral --set postgresql.persistence.enabled=false
          grep -q 'emptyDir: {}' /tmp/helm-bundled-ephemeral.yaml
          if grep -q 'volumeClaimTemplates:' /tmp/helm-bundled-ephemeral.yaml; then
            echo "::error::volumeClaimTemplates must not render when persistence is disabled"
            exit 1
          fi

          for values in values-examples/*.yaml; do
            name="example-$(basename "${values%.*}")"
            render "$name" -f "$values"
            helm lint . -f "$values"
          done

          expect_failure "external database without DSN or Secret" \
            helm template ci . \
              --set postgresql.enabled=false \
              --set-string externalDatabase.dsn='' \
              --set-string externalDatabase.existingSecret=''
          expect_failure "bundled database without any password source" \
            helm template ci . \
              --set-string postgresql.auth.password='' \
              --set-string postgresql.auth.existingSecret=''
          expect_failure "unsupported former Bitnami persistence keys" \
            helm lint . --set postgresql.primary.persistence.size=20Gi
