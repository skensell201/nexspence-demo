# -- Override chart name
nameOverride: ""
# -- Override fully qualified app name
fullnameOverride: ""

image:
  repository: ghcr.io/nexspence/nexspence
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (defaults to chart appVersion)
  tag: ""

imagePullSecrets: []

replicaCount: 1

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Override the name
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- Nexspence application configuration
config:
  # -- External URL (used in download links, Docker subdomain connector)
  baseURL: "http://nexspence.example.com"
  logLevel: "info"
  logFormat: "json"
  httpAddr: ":8081"
  # -- Peers (IPs or CIDRs) allowed to set X-Forwarded-For. Every chart
  # deployment sits behind an ingress/gateway, so leaving this empty (the
  # app's own default) means the audit log and any IP-based logic only ever
  # see the ingress's own pod IP, never the real client. Set to the in-cluster
  # pod CIDR, or "*" to trust every hop (only safe when the server is
  # unreachable except through a proxy you control).
  trustedProxies: []
  # -- JWT secret (min 32 chars). Leave empty to auto-generate a unique random
  # secret on first install and persist it across upgrades (recommended). Set an
  # explicit value only if you need to share the secret across clusters.
  jwtSecret: ""
  # -- Permit the shipped default admin password ("admin123") at startup.
  # Defaults to true so the chart's quick-start boots out of the box; set to false
  # in production once you have set a unique adminPassword. The JWT secret is no
  # longer a shipped default (it is auto-generated when jwtSecret is empty).
  allowInsecureDefaults: true
  jwtExpiryHours: 8
  # -- Create/repair the bootstrap admin on every start. Set to false once real
  # accounts exist, so the admin credentials below can be dropped from values
  # and the Secret; an existing admin is then never touched.
  bootstrapEnabled: true
  # -- Bootstrap admin credentials (ignored when bootstrapEnabled is false)
  adminUsername: "admin"
  adminPassword: "admin123"
  adminEmail: "admin@example.com"
  adminFirstName: "Admin"
  # -- Serve GET /metrics without authentication. It shares the listener with
  # the API, so the default requires a Bearer token; set this to true when only
  # the cluster network reaches the Service and a scrape token would just be one
  # more secret to rotate.
  metricsPublic: false
  # -- Docker subdomain connector: serve each Docker repository on its own
  # hostname, so clients can `docker pull myrepo.example.com/alpine` instead of
  # `docker pull nexspence.example.com:8081/repository/myrepo/alpine`. Needs a
  # wildcard DNS record for baseDomain and an ingress that passes the original
  # Host header through — see docs/docker-subdomain-connector.md.
  docker:
    subdomainConnector:
      enabled: false
      # -- The domain the "<repo>.<baseDomain>" hostnames sit under. Optional
      # when only aliases are used.
      baseDomain: ""
      # -- Hostname → repository name, for DNS names that do not match the
      # repository (a Nexus connector port being migrated, say). Any domain
      # works; the hostname does not have to sit under baseDomain. Setting any
      # alias mounts a small config file into the container, because a YAML map
      # cannot be expressed as an environment variable.
      #   aliases:
      #     docker-hub-proxy.example.com: dockerhub-proxy
      aliases: {}

# -- OIDC single sign-on. Every field below is sensitive (issuer/redirect_url/
# admin_group name real internal infrastructure and access-control policy) and
# renders into secret.yaml, not configmap.yaml — only `enabled` is a plain
# value, since it has to gate templating itself.
oidc:
  enabled: false
  issuer: ""
  publicIssuerUrl: ""
  clientId: ""
  # -- Prefer clientSecretExistingSecret below — a plaintext value here tends
  # to end up committed to a values file. Uncomment only if you genuinely have
  # no existing Secret to point at.
  # clientSecret: ""
  # -- Reference an existing Secret instead of putting the client secret in
  # values.
  clientSecretExistingSecret: ""
  clientSecretExistingSecretKey: "client-secret"
  redirectUrl: ""
  frontendBaseUrl: ""
  scopes: ["openid", "profile", "email", "groups"]
  provisioning: "auto"
  groupsClaim: "groups"
  adminGroup: ""
  usernameClaim: "preferred_username"
  emailClaim: "email"
  nameClaim: "name"
  showLoginButton: true
  cookieSecure: true
  allowedSkewSeconds: 60
  # -- Leave empty to auto-generate and persist across upgrades (same pattern
  # as config.jwtSecret) so an upgrade never rotates it out from under a login
  # in flight.
  cookieKey: ""

# -- Redis: backs the distributed lock (cleanup/GC/replication/migration cron
# coordination across replicas) and the login-attempt rate limiter's shared
# state. Required once replicaCount > 1 / autoscaling.enabled, or every pod
# runs its own uncoordinated schedule and rate limiting stops being global.
redis:
  enabled: false
  auth:
    # -- Prefer existingSecret below — a plaintext value here tends to end up
    # committed to a values file. Uncomment only if you genuinely have no
    # existing Secret to point at.
    # password: ""
    # -- Reference an existing Secret instead of putting the password in values.
    existingSecret: ""
    existingSecretKey: "password"

# -- External Redis (used when redis.enabled=false and you still want the
# distributed-lock/rate-limiter coordination above)
externalRedis:
  enabled: false
  addr: ""
  # -- Prefer existingSecret below — a plaintext value here tends to end up
  # committed to a values file. Uncomment only if you genuinely have no
  # existing Secret to point at.
  # password: ""
  # -- Reference an existing Secret instead of putting the password in values.
  existingSecret: ""
  existingSecretKey: "password"
  db: 0

# -- Blob storage: "local" or "s3"
storage:
  type: local
  local:
    mountPath: "/blobs"
    # -- PVC size for blob storage
    size: "100Gi"
    storageClass: ""
    # -- ReadWriteOnce (default) or ReadWriteMany for a shared filesystem
    # (e.g. AWS EFS via efs-csi) across replicas — LocalBlobStore's writes
    # (atomic rename, single-writer append) don't depend on POSIX locking, so
    # RWX is safe.
    accessMode: "ReadWriteOnce"
    # -- Bring your own PVC (e.g. a statically-provisioned EFS access point):
    # when set, the chart skips rendering its own PVC and mounts this claim.
    existingClaim: ""
  s3:
    # -- Filled when storage.type=s3
    endpoint: ""
    bucket: ""
    region: "us-east-1"
    # -- Prefer existingSecret below — a plaintext value here tends to end up
    # committed to a values file. Uncomment only if you genuinely have no
    # existing Secret to point at.
    # accessKey: ""
    # secretKey: ""
    # -- Reference an existing Secret instead of putting the credentials in values.
    existingSecret: ""
    existingSecretAccessKeyKey: "access-key"
    existingSecretSecretKeyKey: "secret-key"
    # -- Path-style addressing (bucket in the path, not the hostname). Required
    # by MinIO and most non-AWS S3 implementations.
    forcePathStyle: true
    # -- Accept the endpoint's TLS certificate without verifying it. For an
    # on-prem S3 behind a private CA; the connection carries the credentials and
    # every blob, so prefer trusting the CA.
    skipTLSVerify: false

# -- OpenTelemetry distributed tracing (HTTP, DB, blob-store, background jobs,
# cross-instance replication). Off by default — nexspence ships no trace
# backend, point otlpEndpoint at whatever collector/Jaeger/Tempo you run.
tracing:
  enabled: false
  otlpEndpoint: "otel-collector:4317"
  # -- Exporter transport: "grpc" (default, port 4317) or "http" (port 4318)
  otlpProtocol: "grpc"
  # -- Send plaintext instead of TLS — for a collector on the same cluster/VPC
  otlpInsecure: true
  # -- Head-samples root spans at this ratio (0..1); child spans follow their parent
  sampleRatio: 0.1
  serviceName: "nexspence"
  # -- Distinguishes this deployment's traces (e.g. "prod", "staging") when several share one backend
  environment: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8081
  annotations: {}

# ── Ingress (nginx / traefik / cilium ingress-controller) ──────────────
# Exactly ONE of ingress or gateway should be enabled at a time.
ingress:
  enabled: false
  # -- IngressClass name: "nginx" | "traefik" | "cilium"
  className: "nginx"
  annotations: {}
  hosts:
    - host: nexspence.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ── API Gateway: Istio ─────────────────────────────────────────────────
gateway:
  istio:
    enabled: false
    # -- Name of the existing Istio IngressGateway service selector
    gatewaySelector:
      istio: ingressgateway
    # -- Port exposed on the Istio Gateway
    port: 80
    # -- TLS mode: SIMPLE | PASSTHROUGH | MUTUAL | ""
    tlsMode: ""
    # -- Secret name for TLS (required when tlsMode=SIMPLE)
    tlsSecret: ""
    hosts:
      - "nexspence.example.com"
    # -- Extra annotations on the VirtualService
    vsAnnotations: {}
    # -- Timeout for VirtualService routes
    timeout: "300s"

  # ── API Gateway: Cilium (K8s Gateway API) ─────────────────────────────
  cilium:
    enabled: false
    # -- Gateway API GatewayClass name (cilium registers "cilium")
    gatewayClassName: "cilium"
    hosts:
      - host: nexspence.example.com
        paths:
          - path: /
            pathType: PathPrefix
    tls: []
    # -- Extra annotations on the Gateway resource
    gatewayAnnotations: {}

# ── Horizontal Pod Autoscaler ─────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "2000m"
    memory: "1Gi"

# ── Liveness / Readiness probes ───────────────────────────────────────
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 20
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# -- Extra volumes/mounts on the main container, e.g. a custom CA bundle
# Secret/ConfigMap for `database.dsn`'s sslmode=verify-ca/verify-full (which
# already works at the application level — pgxpool.ParseConfig parses standard
# libpq syntax — the chart just has nowhere to put the certificate file).
extraVolumes: []
extraVolumeMounts: []

# ── PostgreSQL sub-chart (bitnami) ────────────────────────────────────
# Set enabled: false and provide externalDatabase.dsn for external Postgres.
postgresql:
  enabled: true
  # Bitnami removed the legacy `docker.io/bitnami/*` image tags from Docker Hub
  # in 2025 (moved to the paid `bitnamisecure` catalog); the archived copies
  # live under `bitnamilegacy/*`. Pin the bundled subchart image there so a
  # default install does not hit ImagePullBackOff. Override or run an external
  # database (postgresql.enabled=false) for production.
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: nexspence
    password: nexspence
    database: nexspence
  primary:
    persistence:
      enabled: true
      size: 10Gi

# -- External PostgreSQL DSN (used when postgresql.enabled=false)
externalDatabase:
  # -- Prefer existingSecret below — a plaintext value here (password
  # included) tends to end up committed to a values file. Uncomment only if
  # you genuinely have no existing Secret to point at.
  # dsn: "postgres://nexspence:nexspence@external-postgres:5432/nexspence?sslmode=disable"
  # -- Reference an existing Secret instead of putting the DSN directly in
  # values. When set, the chart never composes NEXSPENCE_DATABASE_DSN itself —
  # the Deployment reads it straight from this Secret via secretKeyRef.
  existingSecret: ""
  existingSecretKey: "dsn"

# Image scanning (Trivy).
#
# Nexspence ships no scanner. Turning this on renders an initContainer that
# copies the Trivy binary out of the image below into a shared volume, and
# points nexspence at it. The image is pulled by your cluster from a third
# party; you choose the version and you own updating it.
#
# Off means image scanning is unavailable and the UI says so. Scanning of
# Maven, npm, PyPI and Cargo packages goes to OSV.dev over HTTPS and is
# unaffected either way.
scanning:
  enabled: false
  image:
    repository: aquasec/trivy
    # -- Pin to a digest for reproducible pulls, e.g. "0.70.0@sha256:...", same
    # convention as the top-level image.tag.
    tag: "0.70.0"
    pullPolicy: IfNotPresent
  # The binary is ~150 MB; the vulnerability database it downloads on first use
  # lands in the existing cache volume.
  volumeSize: 300Mi
