apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexspence.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexspence.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nexspence.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.postgresql.enabled }}
        # Roll the app when the chart-managed database password changes.
        # Existing Secret contents are opaque to Helm and require a manual restart.
        {{- if .Values.postgresql.auth.existingSecret }}
        checksum/postgresql-password: {{ printf "%s/%s" .Values.postgresql.auth.existingSecret (include "nexspence.postgresql.secretPasswordKey" .) | sha256sum }}
        {{- else }}
        checksum/postgresql-password: {{ .Values.postgresql.auth.password | sha256sum }}
        {{- end }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nexspence.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nexspence.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.postgresql.enabled .Values.scanning.enabled }}
      initContainers:
        {{- if .Values.postgresql.enabled }}
        - name: wait-for-postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - timeout {{ .Values.postgresql.initTimeoutSeconds }} sh -c "until pg_isready -h {{ include "nexspence.postgresql.fullname" . }} -U {{ .Values.postgresql.auth.username | squote }}; do sleep 2; done"
          securityContext:
            {{- toYaml .Values.postgresql.securityContext | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
        {{- end }}
        {{- if .Values.scanning.enabled }}
        # Nexspence ships no scanner. This copies the operator's chosen Trivy
        # into a shared volume; the application execs it from there.
        - name: trivy-copy
          image: "{{ .Values.scanning.image.repository }}:{{ .Values.scanning.image.tag }}"
          imagePullPolicy: {{ .Values.scanning.image.pullPolicy }}
          command: ["sh", "-c", "cp /usr/local/bin/trivy /opt/trivy/trivy && chmod 0755 /opt/trivy/trivy"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: trivy-bin
              mountPath: /opt/trivy
        {{- end }}
      {{- end }}
      containers:
        - name: nexspence
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            # Pin the trivy (CVE scan) cache to the writable emptyDir below.
            # The image sets these too, but pinning them here keeps scans
            # working under readOnlyRootFilesystem regardless of image build —
            # trivy's default cache ($HOME/.cache/trivy) would otherwise resolve
            # onto the read-only rootfs and every image scan would fail.
            - name: HOME
              value: /app
            - name: TRIVY_CACHE_DIR
              value: /app/.cache/trivy
            {{- if .Values.scanning.enabled }}
            - name: NEXSPENCE_SCAN_TRIVY_ENABLED
              value: "true"
            - name: NEXSPENCE_SCAN_TRIVY_BIN
              value: /opt/trivy/trivy
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            # pgx uses PGPASSWORD when the bundled DSN omits userinfo password.
            # This keeps existing Secrets GitOps-safe and passwords out of manifests.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nexspence.postgresql.secretName" . }}
                  key: {{ include "nexspence.postgresql.secretPasswordKey" . }}
            {{- end }}
            {{- if and (not .Values.postgresql.enabled) .Values.externalDatabase.existingSecret }}
            - name: NEXSPENCE_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret | quote }}
                  key: {{ default "dsn" .Values.externalDatabase.existingSecretDsnKey | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "nexspence.fullname" . }}
            - secretRef:
                name: {{ include "nexspence.fullname" . }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem makes the container fs read-only, so every
            # path the app — or the Trivy the operator supplies — writes to
            # needs a writable mount.
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
            {{- if eq .Values.storage.type "local" }}
            - name: blobs
              mountPath: {{ .Values.storage.local.mountPath }}
            {{- end }}
            {{- if .Values.scanning.enabled }}
            - name: trivy-bin
              mountPath: /opt/trivy
              readOnly: true
            {{- end }}
            {{- if .Values.config.docker.subdomainConnector.aliases }}
            - name: config-file
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- end }}
      volumes:
        # Writable scratch dirs (rootfs is read-only). The trivy cache lives at
        # /app/.cache (HOME=/app, TRIVY_CACHE_DIR=/app/.cache/trivy in the image).
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        {{- if .Values.config.docker.subdomainConnector.aliases }}
        - name: config-file
          configMap:
            name: {{ include "nexspence.fullname" . }}-file
        {{- end }}
        {{- if eq .Values.storage.type "local" }}
        - name: blobs
          persistentVolumeClaim:
            claimName: {{ include "nexspence.fullname" . }}-blobs
        {{- end }}
        {{- if .Values.scanning.enabled }}
        - name: trivy-bin
          emptyDir:
            sizeLimit: {{ .Values.scanning.volumeSize }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
